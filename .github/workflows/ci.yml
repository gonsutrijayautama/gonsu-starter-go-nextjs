# CI produk-contoh — setiap PR dan setiap push ke main. Tidak ada satu pun
# secret di berkas ini.
#
# Setiap langkah memanggil target make yang sama dengan yang dijalankan di
# laptop: merah di sini berarti merah juga di `make lint`, `make test`,
# `make e2e`, atau `make smoke`, dan sebaliknya.
#
# Runner GitHub, bukan self-hosted: kode dari PR tidak boleh mendarat di mesin
# yang dapat menjangkau OpenBao (itu tugas release.yml saja).

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Run lama pada ref yang sama dibatalkan: pipeline usang tidak perlu ditunggu.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Sama dengan compose.dev.yaml.
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Format
        run: |
          unformatted="$(gofmt -l cmd internal migrations web/*.go)"
          if [ -n "$unformatted" ]; then
            echo "Belum di-gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: |
          go vet ./...
          go vet -tags dev ./...

      # Kode sqlc di-commit dan tidak diedit tangan. Query dan skema tidak
      # dapat tertinggal dari kode yang memakainya tanpa ketahuan.
      - name: sqlc diff
        run: go tool sqlc diff

      # Dua kali: build rilis (tes membuktikan login pengembangan tidak ikut)
      # dan build dev.
      # Port host postgres acak; konteks `job` hanya tersedia di tingkat langkah.
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://app:app@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/app?sslmode=disable
        run: |
          go test -race -count=1 ./...
          go test -race -count=1 -tags dev ./...

      # Vektor uji login GONSU — termasuk token yang harus DITOLAK — dijalankan
      # terhadap SDK pada versi yang dipin di go.mod.
      - name: Kontrak login GONSU (SDK yang dipin)
        run: go test -count=1 github.com/gonsutrijayautama/gonsu-one-sdk-go/auth github.com/gonsutrijayautama/gonsu-one-sdk-go/web

      - name: Pemindaian dependency
        run: go tool govulncheck ./...

  web:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json

      # eslint (termasuk aturan docs/ui-guide.md), typecheck, dan judul halaman.
      - name: Lint
        run: make -C web lint

  e2e:
    name: Uji ujung ke ujung
    needs: [go, web]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json

      # Pustaka sistem yang dibutuhkan Chromium; di laptop cukup sekali.
      - name: Memasang Chromium
        run: |
          make -C web install
          cd web && bunx playwright install --with-deps chromium

      - name: make e2e
        run: make e2e

  image:
    name: Image rilis
    needs: [go, web]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: 0.0.0-ci
      TRIVY_VERSION: "0.74.0"
      # sha256 trivy_<versi>_Linux-64bit.tar.gz, sama dengan release.yml.
      # Dipatok di sini, bukan dibaca dari checksums.txt rilis yang sama: pihak
      # yang dapat mengganti arsipnya dapat mengganti checksum-nya juga.
      TRIVY_SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Dockerfile yang sama persis dengan release.yml, diuji di bawah
      # batasan chart GONSU (scripts/smoke.sh).
      - name: make smoke
        run: make smoke VERSION="$VERSION"

      - name: Memasang trivy
        run: |
          BASE="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          ARCHIVE="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sfLO "$BASE/$ARCHIVE"
          echo "${TRIVY_SHA256}  ${ARCHIVE}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/bin" trivy
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Ambang yang sama dengan gerbang publikasi GONSU: CRITICAL/HIGH yang
      # sudah ada perbaikannya. Merah di sini berarti rilis juga akan tertahan
      # di `staged`.
      - name: Memindai kerentanan
        run: |
          trivy image --quiet --scanners vuln --severity CRITICAL,HIGH \
            --ignore-unfixed --exit-code 1 "produk-contoh:$VERSION"
