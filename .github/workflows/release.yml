# Rilis produk-contoh ke GONSU: tag v* → image dibangun, dipindai, didaftarkan,
# ditandatangani GONSU, lalu diterbitkan.
#
# Langkah-langkahnya TIDAK ada di sini. Berkas ini hanya memanggil workflow
# rilis GONSU, supaya perbaikan pipeline sampai ke setiap produk tanpa menyalin
# apa pun. Kontraknya — masukan, yang harus sudah ada, dan arti pesan galatnya —
# ada di https://github.com/gonsutrijayautama/gonsu-release.
#
# Berjalan di runner GitHub dan tidak memegang kunci penandatangan: yang
# dibawanya adalah bukti dari GitHub tentang job ini (`id-token: write`), dan
# GONSU yang menandatangani bila bukti itu cocok.
#
# HANYA dipicu tag. Dipanggil dari cabang atau pull request, GONSU menolak
# menandatanganinya; jangan menambahkan trigger lain.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: read
      id-token: write
    uses: gonsutrijayautama/gonsu-release/.github/workflows/release.yml@v1
    with:
      # Harus SAMA dengan kode produk dan variant di Console GONSU.
      product_code: produk-contoh
      variant_code: web
      # Rilis pertama mengikat repository image ini, dan repository GitHub
      # ini, ke produk/variant di atas; rilis berikutnya harus sama.
      image_path: products/produk-contoh-web
    secrets:
      # Satu-satunya secret: token dorong registry, dari tim platform GONSU.
      registry_token: ${{ secrets.GONSU_REGISTRY_CI_TOKEN }}
