# Lingkungan pengembangan LOKAL — bukan paket self-host. Paket self-host dan
# pemasangan cloud disiapkan GONSU.
#
#   make db      database untuk make test dan make migrate
#   make down    menghentikannya
#
# Port host bawaan 15432 (bukan 5432, yang biasanya sudah terpakai). Ubah lewat
# DEV_DB_PORT bila bentrok dengan project lain: DEV_DB_PORT=15433 make test.
name: produk-contoh

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-15432}:5432"
    volumes:
      # PostgreSQL 18 menyimpan data di /var/lib/postgresql/18/docker; volume
      # dipasang di induknya.
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db:
